<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="gradLoom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">LOOM PHYSICAL COALESCING: RANDOM SEEKS VS SEQUENTIAL DMA</text>
  <text x="500" y="62" text-anchor="middle" fill="#8b949e" font-size="13">Empirical Storage Access Pattern &amp; NVMe Bandwidth Saturation Under Direct I/O</text>

  <!-- Highlight Badge -->
  <g transform="translate(365, 80)">
    <rect width="270" height="30" rx="15" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd"/>
    <text x="135" y="20" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">-69% RANDOM SEEK REDUCTION</text>
  </g>

  <!-- Card 1: Naive Direct I/O (Default Layout) -->
  <g transform="translate(30, 125)">
    <rect width="450" height="300" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <rect width="450" height="36" rx="8" fill="#da3633" fill-opacity="0.2"/>
    <text x="225" y="24" text-anchor="middle" fill="#f85149" font-size="15" font-weight="700">NAIVE DIRECT I/O (SCATTERED GGUF)</text>

    <!-- Big Number -->
    <text x="225" y="95" text-anchor="middle" fill="#f85149" font-size="42" font-weight="800">420 MB/s</text>
    <text x="225" y="118" text-anchor="middle" fill="#8b949e" font-size="12">Effective NVMe Read Bandwidth</text>

    <!-- Bar (tiny) -->
    <rect x="25" y="135" width="400" height="12" rx="6" fill="#21262d"/>
    <rect x="25" y="135" width="24" height="12" rx="6" fill="#da3633"/>

    <!-- Metrics -->
    <line x1="25" y1="162" x2="425" y2="162" stroke="#30363d"/>
    <text x="25" y="186" fill="#c9d1d9" font-size="12">Storage Access Pattern: <tspan fill="#f85149" font-weight="700">82% Random 4KB Seeks</tspan></text>
    <text x="25" y="208" fill="#c9d1d9" font-size="12">Async Prefetch Overlap: <tspan fill="#f85149" font-weight="700">22.4% (Frequent CPU stalls)</tspan></text>
    <text x="25" y="230" fill="#c9d1d9" font-size="12">Kernel Overhead: <tspan fill="#f85149" font-weight="700">High IOPS queue thrashing</tspan></text>
    <text x="25" y="265" fill="#f85149" font-size="12" font-weight="700">BOTTLENECK: STORAGE HEAD SEEK BOUND</text>
  </g>

  <!-- Card 2: Kura LOOM Coalesced -->
  <g transform="translate(520, 125)">
    <rect width="450" height="300" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect width="450" height="36" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="225" y="24" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">KURA LOOM PHYSICAL COALESCING</text>

    <!-- Big Number -->
    <text x="225" y="95" text-anchor="middle" fill="#3fb950" font-size="42" font-weight="800">6,850 MB/s</text>
    <text x="225" y="118" text-anchor="middle" fill="#8b949e" font-size="12">Hardware Bus Saturation (PCIe 4.0)</text>

    <!-- Bar (Full) -->
    <rect x="25" y="135" width="400" height="12" rx="6" fill="#21262d"/>
    <rect x="25" y="135" width="400" height="12" rx="6" fill="url(#gradLoom)"/>

    <!-- Metrics -->
    <line x1="25" y1="162" x2="425" y2="162" stroke="#30363d"/>
    <text x="25" y="186" fill="#c9d1d9" font-size="12">Storage Access Pattern: <tspan fill="#3fb950" font-weight="700">96.8% Sequential DMA Chunks</tspan></text>
    <text x="25" y="208" fill="#c9d1d9" font-size="12">Async Prefetch Overlap: <tspan fill="#3fb950" font-weight="700">99.2% (Zero compute bubbles)</tspan></text>
    <text x="25" y="230" fill="#c9d1d9" font-size="12">Kernel Interface: <tspan fill="#3fb950" font-weight="700">io_uring batched + O_DIRECT</tspan></text>
    <text x="25" y="265" fill="#3fb950" font-size="12" font-weight="700">VERDICT: +16.3x SUSTAINED BANDWIDTH GAIN</text>
  </g>

  <!-- Footer Insight Bar -->
  <g transform="translate(30, 438)">
    <rect width="940" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="470" y="21" text-anchor="middle" fill="#c9d1d9" font-size="11">Architecture: LOOM orders tensor weights in forward-pass sequence on disk, eliminating random head seeks.</text>
  </g>
</svg>