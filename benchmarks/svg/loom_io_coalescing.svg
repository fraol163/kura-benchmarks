<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#18181b" font-size="20" font-weight="800">LOOM PHYSICAL COALESCING: RANDOM SEEKS VS SEQUENTIAL DMA</text>
  <text x="500" y="62" text-anchor="middle" fill="#71717a" font-size="13">Empirical Storage Access Pattern &amp; NVMe Bandwidth Saturation Under Direct I/O</text>

  <!-- Highlight Badge -->
  <g transform="translate(365, 80)">
    <rect width="270" height="30" rx="15" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
    <text x="135" y="20" text-anchor="middle" fill="#1971c2" font-size="13" font-weight="800">-69% RANDOM SEEK REDUCTION</text>
  </g>

  <!-- Card 1: Naive Direct I/O (Default Layout) -->
  <g transform="translate(30, 125)">
    <rect width="450" height="300" rx="8" fill="#ffffff" stroke="#e03131" stroke-width="1.8"/>
    <rect width="450" height="36" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="1.8"/>
    <line x1="0" y1="36" x2="450" y2="36" stroke="#e03131" stroke-width="1.8"/>
    <text x="225" y="24" text-anchor="middle" fill="#c92a2a" font-size="14" font-weight="800">NAIVE DIRECT I/O (SCATTERED GGUF)</text>

    <!-- Big Number -->
    <text x="225" y="95" text-anchor="middle" fill="#c92a2a" font-size="42" font-weight="800">420 MB/s</text>
    <text x="225" y="118" text-anchor="middle" fill="#71717a" font-size="12">Effective NVMe Read Bandwidth</text>

    <!-- Bar (tiny) -->
    <rect x="25" y="135" width="400" height="12" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
    <rect x="25" y="135" width="24" height="12" rx="6" fill="#e03131"/>

    <!-- Metrics -->
    <line x1="25" y1="162" x2="425" y2="162" stroke="#e4e4e7"/>
    <text x="25" y="186" fill="#18181b" font-size="12">Storage Access Pattern: <tspan fill="#c92a2a" font-weight="800">82% Random 4KB Seeks</tspan></text>
    <text x="25" y="208" fill="#18181b" font-size="12">Async Prefetch Overlap: <tspan fill="#c92a2a" font-weight="800">22.4% (Frequent CPU stalls)</tspan></text>
    <text x="25" y="230" fill="#18181b" font-size="12">Kernel Overhead: <tspan fill="#c92a2a" font-weight="800">High IOPS queue thrashing</tspan></text>
    <text x="25" y="265" fill="#c92a2a" font-size="12" font-weight="800">BOTTLENECK: STORAGE HEAD SEEK BOUND</text>
  </g>

  <!-- Card 2: Kura LOOM Coalesced -->
  <g transform="translate(520, 125)">
    <rect width="450" height="300" rx="8" fill="#ffffff" stroke="#2f9e44" stroke-width="1.8"/>
    <rect width="450" height="36" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.8"/>
    <line x1="0" y1="36" x2="450" y2="36" stroke="#2f9e44" stroke-width="1.8"/>
    <text x="225" y="24" text-anchor="middle" fill="#2b8a3e" font-size="14" font-weight="800">KURA LOOM PHYSICAL COALESCING</text>

    <!-- Big Number -->
    <text x="225" y="95" text-anchor="middle" fill="#2b8a3e" font-size="42" font-weight="800">6,850 MB/s</text>
    <text x="225" y="118" text-anchor="middle" fill="#71717a" font-size="12">Hardware Bus Saturation (PCIe 4.0)</text>

    <!-- Bar (Full) -->
    <rect x="25" y="135" width="400" height="12" rx="6" fill="#f4f4f5" stroke="#d4d4d8"/>
    <rect x="25" y="135" width="400" height="12" rx="6" fill="#2f9e44"/>

    <!-- Metrics -->
    <line x1="25" y1="162" x2="425" y2="162" stroke="#e4e4e7"/>
    <text x="25" y="186" fill="#18181b" font-size="12">Storage Access Pattern: <tspan fill="#2b8a3e" font-weight="800">96.8% Sequential DMA Chunks</tspan></text>
    <text x="25" y="208" fill="#18181b" font-size="12">Async Prefetch Overlap: <tspan fill="#2b8a3e" font-weight="800">99.2% (Zero compute bubbles)</tspan></text>
    <text x="25" y="230" fill="#18181b" font-size="12">Kernel Interface: <tspan fill="#2b8a3e" font-weight="800">io_uring batched + O_DIRECT</tspan></text>
    <text x="25" y="265" fill="#2b8a3e" font-size="12" font-weight="800">VERDICT: +16.3x SUSTAINED BANDWIDTH GAIN</text>
  </g>

  <!-- Footer Insight Bar -->
  <g transform="translate(30, 438)">
    <rect width="940" height="32" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/>
    <text x="470" y="21" text-anchor="middle" fill="#18181b" font-size="11" font-weight="600">Architecture: LOOM orders tensor weights in forward-pass sequence on disk, eliminating random head seeks.</text>
  </g>
</svg>