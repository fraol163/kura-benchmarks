<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">KURA ABLATION LADDER: CUMULATIVE SPEEDUP</text>
  <text x="500" y="62" text-anchor="middle" fill="#8b949e" font-size="13">Marginal Throughput Gain of Each Subsystem Measured on Qwen2.5-14B (7.5 GB RAM Ceiling)</text>

  <!-- Total Summary Badge -->
  <g transform="translate(730, 20)">
    <rect width="210" height="42" rx="6" fill="#238636" fill-opacity="0.2" stroke="#238636"/>
    <text x="105" y="26" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">+298% TOTAL SPEEDUP</text>
  </g>

  <!-- Horizontal Bars Container -->
  <g transform="translate(60, 95)">
    <!-- Rung 0: Baseline -->
    <g transform="translate(0, 0)">
      <text x="210" y="20" text-anchor="end" fill="#c9d1d9" font-size="12" font-weight="600">Naive Unbuffered Direct I/O</text>
      <rect x="230" y="5" width="100" height="22" rx="4" fill="#30363d"/>
      <text x="340" y="21" fill="#8b949e" font-size="12">0.054 tok/s (1.00x baseline)</text>
    </g>

    <!-- Rung 1: LOOM -->
    <g transform="translate(0, 48)">
      <text x="210" y="20" text-anchor="end" fill="#c9d1d9" font-size="12" font-weight="600">+ LOOM Physical Coalescing</text>
      <rect x="230" y="5" width="110" height="22" rx="4" fill="#1f6feb" fill-opacity="0.6"/>
      <text x="350" y="21" fill="#58a6ff" font-size="12" font-weight="600">0.059 tok/s (+9.5% gain, zero gaps)</text>
    </g>

    <!-- Rung 2: Prefetch V3 -->
    <g transform="translate(0, 96)">
      <text x="210" y="20" text-anchor="end" fill="#c9d1d9" font-size="12" font-weight="600">+ Prefetch V3 Lookahead (W=1..3)</text>
      <rect x="230" y="5" width="187" height="22" rx="4" fill="#1f6feb" fill-opacity="0.8"/>
      <text x="427" y="21" fill="#58a6ff" font-size="12" font-weight="600">0.101 tok/s (+70.5% gain, 99.2% overlap)</text>
    </g>

    <!-- Rung 3: Flash-Attention -->
    <g transform="translate(0, 144)">
      <text x="210" y="20" text-anchor="end" fill="#c9d1d9" font-size="12" font-weight="600">+ Vector Flash-Attention</text>
      <rect x="230" y="5" width="233" height="22" rx="4" fill="#238636" fill-opacity="0.6"/>
      <text x="473" y="21" fill="#3fb950" font-size="12" font-weight="600">0.126 tok/s (+24.8% gain, bounded mem)</text>
    </g>

    <!-- Rung 4: EMBER Progressive -->
    <g transform="translate(0, 192)">
      <text x="210" y="20" text-anchor="end" fill="#c9d1d9" font-size="12" font-weight="600">+ EMBER Tiered Memory Residency</text>
      <rect x="230" y="5" width="257" height="22" rx="4" fill="#238636" fill-opacity="0.75"/>
      <text x="497" y="21" fill="#3fb950" font-size="12" font-weight="600">0.139 tok/s (+10.6% gain, hot pinning)</text>
    </g>

    <!-- Rung 5: Hardware F16C / AVX-512 -->
    <g transform="translate(0, 240)">
      <text x="210" y="20" text-anchor="end" fill="#c9d1d9" font-size="12" font-weight="600">+ Hardware F16C / AVX-512 FMA</text>
      <rect x="230" y="5" width="283" height="22" rx="4" fill="#238636" fill-opacity="0.85"/>
      <text x="523" y="21" fill="#3fb950" font-size="12" font-weight="600">0.153 tok/s (+9.8% compute gain)</text>
    </g>

    <!-- Rung 6: Chunked GEMM Speculative -->
    <g transform="translate(0, 288)">
      <text x="210" y="20" text-anchor="end" fill="#f0f6fc" font-size="12" font-weight="700">+ Chunked GEMM Speculative (K=4)</text>
      <rect x="230" y="5" width="398" height="22" rx="4" fill="url(#barGrad)"/>
      <text x="638" y="21" fill="#56d364" font-size="13" font-weight="700">0.215 tok/s (3.98x total speedup)</text>
    </g>
  </g>

  <!-- Footer Insight Strip -->
  <g transform="translate(60, 420)">
    <rect width="880" height="38" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="24" fill="#c9d1d9" font-size="12">Key Finding: No single optimization is sufficient; high throughput emerges from the strict coordination of all 6 layers.</text>
  </g>
</svg>