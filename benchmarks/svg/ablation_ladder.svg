<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#18181b" font-size="20" font-weight="800">KURA ABLATION LADDER: CUMULATIVE SPEEDUP</text>
  <text x="500" y="62" text-anchor="middle" fill="#71717a" font-size="13">Marginal Throughput Gain of Each Subsystem Measured on Qwen2.5-14B (7.5 GB RAM Ceiling)</text>

  <!-- Total Summary Badge -->
  <g transform="translate(710, 20)">
    <rect width="250" height="42" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.8"/>
    <text x="125" y="26" text-anchor="middle" fill="#2b8a3e" font-size="14" font-weight="800">+210% TOTAL SPEEDUP (3.10x)</text>
  </g>

  <!-- Horizontal Bars Container -->
  <g transform="translate(60, 95)">
    <!-- Rung 0: Baseline -->
    <g transform="translate(0, 0)">
      <text x="210" y="20" text-anchor="end" fill="#18181b" font-size="12" font-weight="700">Naive Unbuffered Direct I/O</text>
      <rect x="230" y="5" width="100" height="22" rx="4" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="1"/>
      <text x="340" y="21" fill="#71717a" font-size="12">0.054 tok/s (1.00x baseline)</text>
    </g>

    <!-- Rung 1: LOOM -->
    <g transform="translate(0, 48)">
      <text x="210" y="20" text-anchor="end" fill="#18181b" font-size="12" font-weight="700">+ LOOM Physical Coalescing</text>
      <rect x="230" y="5" width="110" height="22" rx="4" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
      <text x="350" y="21" fill="#1971c2" font-size="12" font-weight="700">0.059 tok/s (+9.5% gain, zero gaps)</text>
    </g>

    <!-- Rung 2: Prefetch V3 -->
    <g transform="translate(0, 96)">
      <text x="210" y="20" text-anchor="end" fill="#18181b" font-size="12" font-weight="700">+ Prefetch V3 Lookahead (W=1..3)</text>
      <rect x="230" y="5" width="187" height="22" rx="4" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/>
      <text x="427" y="21" fill="#1971c2" font-size="12" font-weight="700">0.101 tok/s (+70.5% gain, 99.2% overlap)</text>
    </g>

    <!-- Rung 3: Flash-Attention -->
    <g transform="translate(0, 144)">
      <text x="210" y="20" text-anchor="end" fill="#18181b" font-size="12" font-weight="700">+ Vector Flash-Attention</text>
      <rect x="230" y="5" width="233" height="22" rx="4" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
      <text x="473" y="21" fill="#2b8a3e" font-size="12" font-weight="700">0.126 tok/s (+24.8% gain, bounded mem)</text>
    </g>

    <!-- Rung 4: EMBER Progressive -->
    <g transform="translate(0, 192)">
      <text x="210" y="20" text-anchor="end" fill="#18181b" font-size="12" font-weight="700">+ EMBER Tiered Memory Residency</text>
      <rect x="230" y="5" width="257" height="22" rx="4" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
      <text x="497" y="21" fill="#2b8a3e" font-size="12" font-weight="700">0.139 tok/s (+10.6% gain, hot pinning)</text>
    </g>

    <!-- Rung 5: Hardware F16C / AVX-512 -->
    <g transform="translate(0, 240)">
      <text x="210" y="20" text-anchor="end" fill="#18181b" font-size="12" font-weight="700">+ Hardware F16C / AVX-512 FMA</text>
      <rect x="230" y="5" width="283" height="22" rx="4" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.8"/>
      <text x="523" y="21" fill="#2b8a3e" font-size="12" font-weight="700">0.153 tok/s (+9.8% compute gain)</text>
    </g>

    <!-- Rung 6: Chunked GEMM Speculative -->
    <g transform="translate(0, 288)">
      <text x="210" y="20" text-anchor="end" fill="#18181b" font-size="12" font-weight="800">+ Chunked GEMM Speculative (K=4)</text>
      <rect x="230" y="5" width="310" height="22" rx="4" fill="#8ce99a" stroke="#2b8a3e" stroke-width="2"/>
      <text x="550" y="21" fill="#237032" font-size="13" font-weight="800">0.168 tok/s (3.10x total speedup, +9.7% gain)</text>
    </g>
  </g>

  <!-- Footer Insight Strip -->
  <g transform="translate(60, 420)">
    <rect width="880" height="38" rx="6" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/>
    <text x="20" y="24" fill="#18181b" font-size="12" font-weight="600">Key Finding: No single optimization is sufficient; high throughput emerges from the strict coordination of all 6 layers.</text>
  </g>
</svg>