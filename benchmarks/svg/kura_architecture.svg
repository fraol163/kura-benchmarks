<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="softSketch" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e8590c" />
    </marker>
    <marker id="arrowheadBlue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1971c2" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="36" text-anchor="middle" fill="#18181b" font-size="22" font-weight="800" letter-spacing="0.5">KURA STORAGE-NATIVE DECOUPLED ARCHITECTURE</text>
  <text x="500" y="60" text-anchor="middle" fill="#71717a" font-size="13">Streaming 30B-70B Neural Models from NVMe into Constrained RAM with Zero GPU Dependency</text>

  <!-- TOP CARD: HOST SYSTEM & RESOURCE ARENA -->
  <g transform="translate(60, 82)" filter="url(#softSketch)">
    <rect width="880" height="92" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
    <rect width="880" height="28" rx="10" fill="#f4f4f5" stroke="#18181b" stroke-width="2"/>
    <line x1="0" y1="28" x2="880" y2="28" stroke="#18181b" stroke-width="2"/>
    <text x="440" y="19" text-anchor="middle" fill="#18181b" font-size="12" font-weight="800" letter-spacing="0.5">HOST SYSTEM &amp; MEMORY SCARCITY ARENA</text>
    
    <text x="30" y="52" fill="#18181b" font-size="12" font-weight="700">CPU Compute Substrate:</text>
    <text x="180" y="52" fill="#52525b" font-size="11.5">AVX-512 FMA / ARM NEON SIMD Tiers | NUMA-Aware Thread Worker Pool</text>
    <text x="30" y="74" fill="#18181b" font-size="12" font-weight="700">Physical Memory Arena:</text>
    <text x="180" y="74" fill="#52525b" font-size="11.5">Strict 4-8 GB RAM Cap | Paged KV-Cache | Hot Embedding &amp; LM-Head Skeleton</text>
    
    <!-- Xiaohei #1: Monitoring Host RAM limit -->
    <g transform="translate(770, 32)">
      <ellipse cx="14" cy="22" rx="8" ry="11" fill="#18181b"/>
      <circle cx="14" cy="9" r="6" fill="#18181b"/>
      <circle cx="12" cy="8" r="1.2" fill="#ffffff"/>
      <circle cx="16" cy="8" r="1.2" fill="#ffffff"/>
      <line x1="11" y1="33" x2="10" y2="42" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="17" y1="33" x2="18" y2="42" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 6 20 Q -4 14 -12 16" fill="none" stroke="#18181b" stroke-width="1.6" stroke-linecap="round"/>
      <text x="-70" y="18" fill="#e8590c" font-size="10.5" font-weight="700">RAM &lt; 8 GB Safe!</text>
    </g>
  </g>

  <!-- Connectors from Host to Engines -->
  <path d="M 500 174 L 500 205" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="500,211 495,203 505,203" fill="#18181b"/>
  <text x="510" y="196" fill="#71717a" font-size="10.5" font-weight="600">KAEF Control Loop (Observe - Forecast - Price - Search - Execute)</text>

  <!-- MIDDLE ROW: 4 CORE ENGINES -->

  <!-- 1. SENSE PROFILER -->
  <g transform="translate(60, 218)" filter="url(#softSketch)">
    <rect width="195" height="190" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="195" height="30" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="30" x2="195" y2="30" stroke="#18181b" stroke-width="1.8"/>
    <text x="97" y="20" text-anchor="middle" fill="#18181b" font-size="11.5" font-weight="800">SENSE PROFILER</text>
    
    <text x="14" y="52" fill="#18181b" font-size="11" font-weight="700">Hardware Probe</text>
    <text x="14" y="70" fill="#52525b" font-size="10.5">• SIMD vector capabilities</text>
    <text x="14" y="86" fill="#52525b" font-size="10.5">• NUMA affinity &amp; memory bw</text>
    <text x="14" y="102" fill="#52525b" font-size="10.5">• Storage latency &amp; queue depth</text>
    
    <text x="14" y="128" fill="#18181b" font-size="11" font-weight="700">Regime Classifier</text>
    <text x="14" y="146" fill="#52525b" font-size="10.5">• T_io vs T_compute ratio</text>
    <text x="14" y="162" fill="#52525b" font-size="10.5">• Adaptive precision selector</text>
    <text x="14" y="180" fill="#2f9e44" font-size="10" font-weight="700">Autonomous Calibration</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 255 313 L 285 313" stroke="#e8590c" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>

  <!-- 2. KAEF PLANNER (CES / MEC / ERM) -->
  <g transform="translate(290, 218)" filter="url(#softSketch)">
    <rect width="195" height="190" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="195" height="30" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="30" x2="195" y2="30" stroke="#18181b" stroke-width="1.8"/>
    <text x="97" y="20" text-anchor="middle" fill="#18181b" font-size="11.5" font-weight="800">KAEF PLANNER</text>
    
    <text x="14" y="52" fill="#18181b" font-size="11" font-weight="700">CES Beam Search</text>
    <text x="14" y="70" fill="#52525b" font-size="10.5">• Action trajectory planning</text>
    <text x="14" y="86" fill="#52525b" font-size="10.5">• Lambda-consistent pruning</text>
    
    <text x="14" y="112" fill="#18181b" font-size="11" font-weight="700">Economic Valuation</text>
    <text x="14" y="130" fill="#52525b" font-size="10.5">• MEC: Trajectory value-delta</text>
    <text x="14" y="146" fill="#52525b" font-size="10.5">• ERM: Convex scarcity prices</text>
    <text x="14" y="162" fill="#52525b" font-size="10.5">• CRF: p50/p90 forecast bands</text>
    <text x="14" y="180" fill="#1971c2" font-size="10" font-weight="700">Closed-Loop Optimization</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 485 313 L 515 313" stroke="#e8590c" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>

  <!-- 3. LOOM STORAGE -->
  <g transform="translate(520, 218)" filter="url(#softSketch)">
    <rect width="195" height="190" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="195" height="30" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="30" x2="195" y2="30" stroke="#18181b" stroke-width="1.8"/>
    <text x="97" y="20" text-anchor="middle" fill="#18181b" font-size="11.5" font-weight="800">LOOM STORAGE</text>
    
    <text x="14" y="52" fill="#18181b" font-size="11" font-weight="700">Physical Coalescing</text>
    <text x="14" y="70" fill="#52525b" font-size="10.5">• Execution-order layout</text>
    <text x="14" y="86" fill="#52525b" font-size="10.5">• Zero random NVMe seeks</text>
    <text x="14" y="102" fill="#52525b" font-size="10.5">• MoE Expert striping</text>
    
    <text x="14" y="128" fill="#18181b" font-size="11" font-weight="700">Direct Physical I/O</text>
    <text x="14" y="146" fill="#52525b" font-size="10.5">• io_uring asynchronous DMA</text>
    <text x="14" y="162" fill="#52525b" font-size="10.5">• O_DIRECT unbuffered reads</text>
    <text x="14" y="180" fill="#e8590c" font-size="10" font-weight="700">Sequential Saturation</text>
  </g>

  <!-- Flow 3 -> 4 -->
  <path d="M 715 313 L 745 313" stroke="#e8590c" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>

  <!-- 4. EMBER & VECTOR ENGINE -->
  <g transform="translate(750, 218)" filter="url(#softSketch)">
    <rect width="190" height="190" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="190" height="30" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="30" x2="190" y2="30" stroke="#18181b" stroke-width="1.8"/>
    <text x="95" y="20" text-anchor="middle" fill="#18181b" font-size="11.5" font-weight="800">EMBER &amp; VECTOR</text>
    
    <text x="14" y="52" fill="#18181b" font-size="11" font-weight="700">Tiered Fidelity</text>
    <text x="14" y="70" fill="#52525b" font-size="10.5">• Hot resident skeleton</text>
    <text x="14" y="86" fill="#52525b" font-size="10.5">• Speculative draft verification</text>
    
    <text x="14" y="112" fill="#18181b" font-size="11" font-weight="700">SIMD Vector Kernels</text>
    <text x="14" y="130" fill="#52525b" font-size="10.5">• FMA matmul (Q4/Q8)</text>
    <text x="14" y="146" fill="#52525b" font-size="10.5">• Flash-Attention O(N)</text>
    <text x="14" y="162" fill="#52525b" font-size="10.5">• Fused SwiGLU / SiLU</text>
    <text x="14" y="180" fill="#2f9e44" font-size="10" font-weight="700">100% Bitwise Parity</text>
  </g>

  <!-- Connectors to NVMe Storage -->
  <path d="M 617 408 L 617 448" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
  <polygon points="617,454 612,446 622,446" fill="#18181b"/>

  <!-- BOTTOM CARD: NVMe DIRECT STORAGE TIER -->
  <g transform="translate(60, 460)" filter="url(#softSketch)">
    <rect width="880" height="125" rx="10" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
    <rect width="880" height="28" rx="10" fill="#f4f4f5" stroke="#18181b" stroke-width="2"/>
    <line x1="0" y1="28" x2="880" y2="28" stroke="#18181b" stroke-width="2"/>
    <text x="440" y="19" text-anchor="middle" fill="#18181b" font-size="12" font-weight="800" letter-spacing="0.5">NVMe DIRECT STORAGE TIER (O_DIRECT / io_uring)</text>

    <!-- Sub-tiers -->
    <g transform="translate(25, 42)">
      <rect width="250" height="66" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.2"/>
      <text x="14" y="20" fill="#1971c2" font-size="11.5" font-weight="700">High-Bandwidth NVMe Array</text>
      <text x="14" y="38" fill="#52525b" font-size="10.5">• Gen4x4 / Gen5 (7.1+ GB/s DMA)</text>
      <text x="14" y="54" fill="#2f9e44" font-size="10" font-weight="600">Zero host memory ballooning</text>
    </g>

    <g transform="translate(300, 42)">
      <rect width="280" height="66" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.2"/>
      <text x="14" y="20" fill="#e8590c" font-size="11.5" font-weight="700">MoE Expert Coalesced Layout</text>
      <text x="14" y="38" fill="#52525b" font-size="10.5">• 8 of 64 experts activated per token</text>
      <text x="14" y="54" fill="#2f9e44" font-size="10" font-weight="600">Transfers ~68 MB instead of 35 GB</text>
    </g>

    <!-- Xiaohei #2: Operating the NVMe DMA streaming cart -->
    <g transform="translate(680, 42)">
      <rect width="175" height="66" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.2"/>
      <!-- Xiaohei pulling cart -->
      <g transform="translate(20, 10)">
        <ellipse cx="14" cy="22" rx="8" ry="11" fill="#18181b"/>
        <circle cx="14" cy="9" r="6" fill="#18181b"/>
        <circle cx="12" cy="8" r="1.2" fill="#ffffff"/>
        <circle cx="16" cy="8" r="1.2" fill="#ffffff"/>
        <line x1="11" y1="33" x2="8" y2="44" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="17" y1="33" x2="20" y2="44" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Rope / Arm -->
        <path d="M 22 20 L 40 28" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Cart with weights -->
        <rect x="42" y="16" width="30" height="18" rx="2" fill="#e8590c" stroke="#18181b" stroke-width="1.5"/>
        <circle cx="48" cy="38" r="4" fill="#18181b"/>
        <circle cx="66" cy="38" r="4" fill="#18181b"/>
        <text x="80" y="24" fill="#e8590c" font-size="10" font-weight="800">Weights</text>
        <text x="80" y="36" fill="#18181b" font-size="9" font-weight="600">7.1 GB/s</text>
      </g>
    </g>
  </g>
</svg>