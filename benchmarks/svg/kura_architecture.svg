<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gradBoxBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0e131a"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="42" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700" letter-spacing="0.5">KURA STORAGE-NATIVE DECOUPLED ARCHITECTURE</text>
  <text x="500" y="68" text-anchor="middle" fill="#8b949e" font-size="13">High-Throughput Local LLM Execution Substrate Powered by NVMe, RAM, and Vector SIMD</text>

  <!-- Flow Arrows / Connectors -->
  <line x1="240" y1="205" x2="268" y2="205" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="272,205 264,200 264,210" fill="#58a6ff"/>

  <line x1="490" y1="205" x2="518" y2="205" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="522,205 514,200 514,210" fill="#58a6ff"/>

  <line x1="740" y1="205" x2="768" y2="205" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="772,205 764,200 764,210" fill="#58a6ff"/>

  <!-- BOX 1: SENSE -->
  <g transform="translate(25, 100)" filter="url(#boxShadow)">
    <rect width="215" height="210" rx="8" fill="url(#gradBoxBlue)" stroke="#30363d" stroke-width="1.5"/>
    <rect width="215" height="34" rx="8" fill="#1f2937"/>
    <text x="107" y="22" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">◈ SENSE PROFILER</text>
    <text x="16" y="58" fill="#c9d1d9" font-size="12" font-weight="600">Hardware Probe</text>
    <text x="16" y="78" fill="#8b949e" font-size="11">• AVX-512 / ARM NEON</text>
    <text x="16" y="96" fill="#8b949e" font-size="11">• NUMA Topology Pinning</text>
    <text x="16" y="114" fill="#8b949e" font-size="11">• Direct NVMe IO Probe</text>
    <text x="16" y="142" fill="#c9d1d9" font-size="12" font-weight="600">Regime Classifier</text>
    <text x="16" y="162" fill="#8b949e" font-size="11">• T_io / T_compute Ratio</text>
    <text x="16" y="180" fill="#8b949e" font-size="11">• Adaptive Q3/Q4 Quant</text>
    <text x="16" y="198" fill="#3fb950" font-size="10" font-weight="600">Autonomous Calibration</text>
  </g>

  <!-- BOX 2: LOOM -->
  <g transform="translate(275, 100)" filter="url(#boxShadow)">
    <rect width="215" height="210" rx="8" fill="url(#gradBoxBlue)" stroke="#30363d" stroke-width="1.5"/>
    <rect width="215" height="34" rx="8" fill="#1f2937"/>
    <text x="107" y="22" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700">◈ LOOM STORAGE</text>
    <text x="16" y="58" fill="#c9d1d9" font-size="12" font-weight="600">Coalesced Layout</text>
    <text x="16" y="78" fill="#8b949e" font-size="11">• Forward-pass order</text>
    <text x="16" y="96" fill="#8b949e" font-size="11">• Zero random seeks</text>
    <text x="16" y="114" fill="#8b949e" font-size="11">• MoE Expert Looming</text>
    <text x="16" y="142" fill="#c9d1d9" font-size="12" font-weight="600">Direct Physical I/O</text>
    <text x="16" y="162" fill="#8b949e" font-size="11">• io_uring Batched async</text>
    <text x="16" y="180" fill="#8b949e" font-size="11">• O_DIRECT unbuffered</text>
    <text x="16" y="198" fill="#3fb950" font-size="10" font-weight="600">Sequential Saturation</text>
  </g>

  <!-- BOX 3: EMBER -->
  <g transform="translate(525, 100)" filter="url(#boxShadow)">
    <rect width="215" height="210" rx="8" fill="url(#gradBoxBlue)" stroke="#30363d" stroke-width="1.5"/>
    <rect width="215" height="34" rx="8" fill="#1f2937"/>
    <text x="107" y="22" text-anchor="middle" fill="#f778ba" font-size="13" font-weight="700">◈ EMBER MEMORY</text>
    <text x="16" y="58" fill="#c9d1d9" font-size="12" font-weight="600">Decoupled Tiers</text>
    <text x="16" y="78" fill="#8b949e" font-size="11">• Hot: Embed + Head RAM</text>
    <text x="16" y="96" fill="#8b949e" font-size="11">• Warm: Prefix Layers</text>
    <text x="16" y="114" fill="#8b949e" font-size="11">• Cold: NVMe Streamed</text>
    <text x="16" y="142" fill="#c9d1d9" font-size="12" font-weight="600">KV Management</text>
    <text x="16" y="162" fill="#8b949e" font-size="11">• Paged KV + INT8 Cache</text>
    <text x="16" y="180" fill="#8b949e" font-size="11">• O(1) Causal Rollback</text>
    <text x="16" y="198" fill="#3fb950" font-size="10" font-weight="600">Strict cgroup Safe</text>
  </g>

  <!-- BOX 4: VECTOR ENGINE -->
  <g transform="translate(775, 100)" filter="url(#boxShadow)">
    <rect width="200" height="210" rx="8" fill="url(#gradBoxBlue)" stroke="#30363d" stroke-width="1.5"/>
    <rect width="200" height="34" rx="8" fill="#1f2937"/>
    <text x="100" y="22" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">◈ VECTOR KERNELS</text>
    <text x="16" y="58" fill="#c9d1d9" font-size="12" font-weight="600">SIMD Execution</text>
    <text x="16" y="78" fill="#8b949e" font-size="11">• Chunked GEMM (K=4)</text>
    <text x="16" y="96" fill="#8b949e" font-size="11">• AVX-512 + ARM NEON</text>
    <text x="16" y="114" fill="#8b949e" font-size="11">• Dynamic Dequant</text>
    <text x="16" y="142" fill="#c9d1d9" font-size="12" font-weight="600">Attention &amp; MLP</text>
    <text x="16" y="162" fill="#8b949e" font-size="11">• Flash-Attention O(N)</text>
    <text x="16" y="180" fill="#8b949e" font-size="11">• Fused SwiGLU / SiLU</text>
    <text x="16" y="198" fill="#3fb950" font-size="10" font-weight="600">100% Bitwise Parity</text>
  </g>

  <!-- Bottom Enterprise Services Strip -->
  <g transform="translate(25, 340)" filter="url(#boxShadow)">
    <rect width="950" height="145" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="950" height="30" rx="8" fill="#21262d"/>
    <text x="475" y="20" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="700">PRODUCTION SERVICES &amp; PROTOCOL INTERFACES</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 45)">
      <rect width="290" height="85" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="14" y="24" fill="#58a6ff" font-size="12" font-weight="700">OpenAI-Compatible HTTP API</text>
      <text x="14" y="44" fill="#8b949e" font-size="11">• SSE Streaming (/v1/chat)</text>
      <text x="14" y="62" fill="#8b949e" font-size="11">• Health &amp; Dynamic Metrics</text>
      <text x="14" y="78" fill="#3fb950" font-size="10">Zero-downtime swap (&lt;1s)</text>
    </g>

    <g transform="translate(330, 45)">
      <rect width="290" height="85" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="14" y="24" fill="#d29922" font-size="12" font-weight="700">Speculative Verification Core</text>
      <text x="14" y="44" fill="#8b949e" font-size="11">• K=4 Draft Token Batching</text>
      <text x="14" y="62" fill="#8b949e" font-size="11">• Causal KV Cache Rollback</text>
      <text x="14" y="78" fill="#3fb950" font-size="10">&gt;= 2.18x target speedup</text>
    </g>

    <g transform="translate(640, 45)">
      <rect width="290" height="85" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="14" y="24" fill="#3fb950" font-size="12" font-weight="700">CLI &amp; Autonomous Telemetry</text>
      <text x="14" y="44" fill="#8b949e" font-size="11">• kura profile (JSON/Text)</text>
      <text x="14" y="62" fill="#8b949e" font-size="11">• kura plan --budget &lt;MB&gt;</text>
      <text x="14" y="78" fill="#3fb950" font-size="10">Zero external telemetry</text>
    </g>
  </g>
</svg>