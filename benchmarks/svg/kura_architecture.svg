<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="softSketch" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="38" text-anchor="middle" fill="#18181b" font-size="21" font-weight="800" letter-spacing="0.5">KURA STORAGE-NATIVE DECOUPLED ARCHITECTURE</text>
  <text x="500" y="62" text-anchor="middle" fill="#71717a" font-size="13">High-Throughput Local LLM Execution Substrate Powered by NVMe, RAM, and Vector SIMD</text>

  <!-- Xiaohei Engineer at Top Right -->
  <g transform="translate(880, 15)">
    <ellipse cx="20" cy="28" rx="11" ry="14" fill="#18181b"/>
    <circle cx="20" cy="12" r="8" fill="#18181b"/>
    <circle cx="17" cy="11" r="1.5" fill="#ffffff"/>
    <circle cx="23" cy="11" r="1.5" fill="#ffffff"/>
    <line x1="16" y1="42" x2="15" y2="52" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="24" y1="42" x2="25" y2="52" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 9 26 Q -4 18 -16 20" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <text x="-22" y="14" fill="#e8590c" font-size="10" font-weight="700">Observe!</text>
  </g>

  <!-- Flow Arrows / Connectors (Orange Hand-Drawn Flow) -->
  <path d="M 240 205 L 268 205" stroke="#e8590c" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
  <polygon points="274,205 264,200 264,210" fill="#e8590c"/>

  <path d="M 490 205 L 518 205" stroke="#e8590c" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
  <polygon points="524,205 514,200 514,210" fill="#e8590c"/>

  <path d="M 740 205 L 768 205" stroke="#e8590c" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
  <polygon points="774,205 764,200 764,210" fill="#e8590c"/>

  <!-- BOX 1: SENSE -->
  <g transform="translate(25, 95)" filter="url(#softSketch)">
    <rect width="215" height="215" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="215" height="34" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="34" x2="215" y2="34" stroke="#18181b" stroke-width="1.8"/>
    <text x="107" y="22" text-anchor="middle" fill="#18181b" font-size="12" font-weight="800">SENSE PROFILER</text>
    <text x="16" y="58" fill="#18181b" font-size="12" font-weight="700">Hardware Probe</text>
    <text x="16" y="78" fill="#52525b" font-size="11">• AVX-512 / ARM NEON</text>
    <text x="16" y="96" fill="#52525b" font-size="11">• NUMA Topology Pinning</text>
    <text x="16" y="114" fill="#52525b" font-size="11">• Direct NVMe IO Probe</text>
    <text x="16" y="142" fill="#18181b" font-size="12" font-weight="700">Regime Classifier</text>
    <text x="16" y="162" fill="#52525b" font-size="11">• T_io / T_compute Ratio</text>
    <text x="16" y="180" fill="#52525b" font-size="11">• Adaptive Q3/Q4 Quant</text>
    <text x="16" y="200" fill="#2f9e44" font-size="10.5" font-weight="700">Autonomous Calibration</text>
  </g>

  <!-- BOX 2: LOOM -->
  <g transform="translate(275, 95)" filter="url(#softSketch)">
    <rect width="215" height="215" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="215" height="34" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="34" x2="215" y2="34" stroke="#18181b" stroke-width="1.8"/>
    <text x="107" y="22" text-anchor="middle" fill="#18181b" font-size="12" font-weight="800">LOOM STORAGE</text>
    <text x="16" y="58" fill="#18181b" font-size="12" font-weight="700">Coalesced Layout</text>
    <text x="16" y="78" fill="#52525b" font-size="11">• Forward-pass order</text>
    <text x="16" y="96" fill="#52525b" font-size="11">• Zero random seeks</text>
    <text x="16" y="114" fill="#52525b" font-size="11">• MoE Expert Looming</text>
    <text x="16" y="142" fill="#18181b" font-size="12" font-weight="700">Direct Physical I/O</text>
    <text x="16" y="162" fill="#52525b" font-size="11">• io_uring Batched async</text>
    <text x="16" y="180" fill="#52525b" font-size="11">• O_DIRECT unbuffered</text>
    <text x="16" y="200" fill="#2f9e44" font-size="10.5" font-weight="700">Sequential Saturation</text>
  </g>

  <!-- BOX 3: EMBER -->
  <g transform="translate(525, 95)" filter="url(#softSketch)">
    <rect width="215" height="215" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="215" height="34" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="34" x2="215" y2="34" stroke="#18181b" stroke-width="1.8"/>
    <text x="107" y="22" text-anchor="middle" fill="#18181b" font-size="12" font-weight="800">EMBER MEMORY</text>
    <text x="16" y="58" fill="#18181b" font-size="12" font-weight="700">Decoupled Tiers</text>
    <text x="16" y="78" fill="#52525b" font-size="11">• Hot: Embed + Head RAM</text>
    <text x="16" y="96" fill="#52525b" font-size="11">• Warm: Prefix Layers</text>
    <text x="16" y="114" fill="#52525b" font-size="11">• Cold: NVMe Streamed</text>
    <text x="16" y="142" fill="#18181b" font-size="12" font-weight="700">KV Management</text>
    <text x="16" y="162" fill="#52525b" font-size="11">• Paged KV + INT8 Cache</text>
    <text x="16" y="180" fill="#52525b" font-size="11">• O(1) Causal Rollback</text>
    <text x="16" y="200" fill="#2f9e44" font-size="10.5" font-weight="700">Strict cgroup Safe</text>
  </g>

  <!-- BOX 4: VECTOR ENGINE -->
  <g transform="translate(775, 95)" filter="url(#softSketch)">
    <rect width="200" height="215" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="200" height="34" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="34" x2="200" y2="34" stroke="#18181b" stroke-width="1.8"/>
    <text x="100" y="22" text-anchor="middle" fill="#18181b" font-size="12" font-weight="800">VECTOR KERNELS</text>
    <text x="16" y="58" fill="#18181b" font-size="12" font-weight="700">SIMD Execution</text>
    <text x="16" y="78" fill="#52525b" font-size="11">• Chunked GEMM (K=4)</text>
    <text x="16" y="96" fill="#52525b" font-size="11">• AVX-512 + ARM NEON</text>
    <text x="16" y="114" fill="#52525b" font-size="11">• Dynamic Dequant</text>
    <text x="16" y="142" fill="#18181b" font-size="12" font-weight="700">Attention &amp; MLP</text>
    <text x="16" y="162" fill="#52525b" font-size="11">• Flash-Attention O(N)</text>
    <text x="16" y="180" fill="#52525b" font-size="11">• Fused SwiGLU / SiLU</text>
    <text x="16" y="200" fill="#2f9e44" font-size="10.5" font-weight="700">100% Bitwise Parity</text>
  </g>

  <!-- Bottom Enterprise Services Strip -->
  <g transform="translate(25, 345)" filter="url(#softSketch)">
    <rect width="950" height="155" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="950" height="32" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="32" x2="950" y2="32" stroke="#18181b" stroke-width="1.8"/>
    <text x="475" y="21" text-anchor="middle" fill="#18181b" font-size="12" font-weight="800">PRODUCTION SERVICES &amp; PROTOCOL INTERFACES</text>

    <!-- Sub-boxes -->
    <g transform="translate(20, 48)">
      <rect width="290" height="92" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#1971c2" font-size="12" font-weight="700">OpenAI-Compatible HTTP API</text>
      <text x="14" y="46" fill="#52525b" font-size="11">• SSE Streaming (/v1/chat)</text>
      <text x="14" y="64" fill="#52525b" font-size="11">• Health &amp; Dynamic Metrics</text>
      <text x="14" y="82" fill="#2f9e44" font-size="10.5" font-weight="600">Zero-downtime swap (&lt;1s)</text>
    </g>

    <g transform="translate(330, 48)">
      <rect width="290" height="92" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#e8590c" font-size="12" font-weight="700">Speculative Verification Core</text>
      <text x="14" y="46" fill="#52525b" font-size="11">• K=4 Draft Token Batching</text>
      <text x="14" y="64" fill="#52525b" font-size="11">• Causal KV Cache Rollback</text>
      <text x="14" y="82" fill="#2f9e44" font-size="10.5" font-weight="600">&gt;= 2.18x target speedup</text>
    </g>

    <g transform="translate(640, 48)">
      <rect width="290" height="92" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#2f9e44" font-size="12" font-weight="700">CLI &amp; Autonomous Telemetry</text>
      <text x="14" y="46" fill="#52525b" font-size="11">• kura profile (JSON/Text)</text>
      <text x="14" y="64" fill="#52525b" font-size="11">• kura plan --budget &lt;MB&gt;</text>
      <text x="14" y="82" fill="#2f9e44" font-size="10.5" font-weight="600">Zero external telemetry</text>
    </g>
  </g>
</svg>