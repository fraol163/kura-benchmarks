<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">SPECULATIVE VERIFICATION: CHUNKED GEMM SPEEDUP</text>
  <text x="500" y="62" text-anchor="middle" fill="#8b949e" font-size="13">Empirical Draft Token Verification Latency &amp; Bitwise Parity Under Strict RAM Limits</text>

  <!-- Highlight Badge -->
  <g transform="translate(365, 80)">
    <rect width="270" height="30" rx="15" fill="#238636" fill-opacity="0.2" stroke="#238636"/>
    <text x="135" y="20" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">2.18x VERIFICATION ACCELERATION</text>
  </g>

  <!-- Left Card: Chunked GEMM Batch Verification -->
  <g transform="translate(30, 125)">
    <rect width="450" height="300" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect width="450" height="32" rx="8" fill="#21262d"/>
    <text x="225" y="21" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">Verification Latency by Draft Window (K)</text>

    <!-- Table Rows -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#8b949e" font-size="11" font-weight="700">Draft Batch Size</text>
      <text x="160" y="15" fill="#8b949e" font-size="11" font-weight="700">Verification Latency</text>
      <text x="395" y="15" text-anchor="end" fill="#3fb950" font-size="11" font-weight="700">Speedup</text>
      <line x1="0" y1="25" x2="410" y2="25" stroke="#30363d"/>

      <text x="0" y="55" fill="#c9d1d9" font-size="12">K=1 (Sequential Base)</text>
      <text x="160" y="55" fill="#c9d1d9" font-size="12">42.6 ms / token</text>
      <text x="395" y="55" text-anchor="end" fill="#8b949e" font-size="12">1.00x</text>

      <text x="0" y="95" fill="#c9d1d9" font-size="12">K=2 (Batched Draft)</text>
      <text x="160" y="95" fill="#58a6ff" font-size="12">26.1 ms / token</text>
      <text x="395" y="95" text-anchor="end" fill="#58a6ff" font-size="12" font-weight="600">1.63x</text>

      <text x="0" y="135" fill="#c9d1d9" font-size="12">K=3 (Multi-Token)</text>
      <text x="160" y="135" fill="#58a6ff" font-size="12">21.8 ms / token</text>
      <text x="395" y="135" text-anchor="end" fill="#58a6ff" font-size="12" font-weight="600">1.95x</text>

      <text x="0" y="175" fill="#f0f6fc" font-size="12" font-weight="700">K=4 (Chunked GEMM)</text>
      <text x="160" y="175" fill="#3fb950" font-size="12" font-weight="700">19.5 ms / token</text>
      <text x="395" y="175" text-anchor="end" fill="#3fb950" font-size="12" font-weight="700">2.18x</text>

      <line x1="0" y1="195" x2="410" y2="195" stroke="#30363d"/>
      <text x="0" y="222" fill="#3fb950" font-size="11" font-weight="600">Bitwise Parity: 100.0% exact match vs sequential reference</text>
    </g>
  </g>

  <!-- Right Card: Atlas Predictive Prefetch Accuracy -->
  <g transform="translate(520, 125)">
    <rect width="450" height="300" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect width="450" height="32" rx="8" fill="#21262d"/>
    <text x="225" y="21" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">Atlas Markov Prefetch Cache Hit Rate</text>

    <!-- Table Rows -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#8b949e" font-size="11" font-weight="700">Workload Regime</text>
      <text x="160" y="15" fill="#8b949e" font-size="11" font-weight="700">Prediction Accuracy</text>
      <text x="395" y="15" text-anchor="end" fill="#3fb950" font-size="11" font-weight="700">Cache Hit Rate</text>
      <line x1="0" y1="25" x2="410" y2="25" stroke="#30363d"/>

      <text x="0" y="55" fill="#c9d1d9" font-size="12">Seen (Code &amp; Chat)</text>
      <text x="160" y="55" fill="#58a6ff" font-size="12">99.1% top-k</text>
      <text x="395" y="55" text-anchor="end" fill="#3fb950" font-size="12" font-weight="600">98.4%</text>

      <text x="0" y="95" fill="#c9d1d9" font-size="12">Unseen (Long Docs)</text>
      <text x="160" y="95" fill="#58a6ff" font-size="12">97.4% top-k</text>
      <text x="395" y="95" text-anchor="end" fill="#3fb950" font-size="12" font-weight="600">96.2%</text>

      <text x="0" y="135" fill="#c9d1d9" font-size="12">Shifted Domain</text>
      <text x="160" y="135" fill="#58a6ff" font-size="12">95.8% top-k</text>
      <text x="395" y="135" text-anchor="end" fill="#3fb950" font-size="12" font-weight="600">94.8%</text>

      <text x="0" y="175" fill="#f0f6fc" font-size="12" font-weight="700">Weighted Average</text>
      <text x="160" y="175" fill="#3fb950" font-size="12" font-weight="700">97.8% top-k</text>
      <text x="395" y="175" text-anchor="end" fill="#3fb950" font-size="12" font-weight="700">96.8%</text>

      <line x1="0" y1="195" x2="410" y2="195" stroke="#30363d"/>
      <text x="0" y="222" fill="#3fb950" font-size="11" font-weight="600">Pipeline Efficiency: Zero I/O stall bubbles during verification</text>
    </g>
  </g>

  <!-- Footer Insight Bar -->
  <g transform="translate(30, 438)">
    <rect width="940" height="32" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="470" y="21" text-anchor="middle" fill="#c9d1d9" font-size="11">Speculation: Kura verifies K=4 draft tokens concurrently via SIMD chunked GEMM with causal KV rollback.</text>
  </g>
</svg>