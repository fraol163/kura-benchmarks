<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#18181b" font-size="20" font-weight="800">LONG CONTEXT SCALING: FLASH-ATTENTION VS STANDARD</text>
  <text x="500" y="62" text-anchor="middle" fill="#71717a" font-size="13">Empirical Execution Time &amp; Peak Memory Scaling up to 32,768 Tokens Under 7.5 GB RAM Limit</text>

  <!-- Left Card: Attention Execution Time (O(N) vs O(N^2)) -->
  <g transform="translate(30, 90)">
    <rect width="450" height="350" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="450" height="32" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="32" x2="450" y2="32" stroke="#18181b" stroke-width="1.8"/>
    <text x="225" y="21" text-anchor="middle" fill="#18181b" font-size="13" font-weight="800">Attention Prefill Latency (Seconds)</text>

    <!-- Table Rows -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#71717a" font-size="11" font-weight="700">Context Length</text>
      <text x="145" y="15" fill="#2b8a3e" font-size="11" font-weight="800">Kura Flash-Attn O(N)</text>
      <text x="395" y="15" text-anchor="end" fill="#c92a2a" font-size="11" font-weight="800">Standard O(N²)</text>
      <line x1="0" y1="25" x2="410" y2="25" stroke="#e4e4e7"/>

      <text x="0" y="50" fill="#18181b" font-size="12">512 tokens</text>
      <text x="145" y="50" fill="#2b8a3e" font-size="12" font-weight="700">0.42 s</text>
      <text x="395" y="50" text-anchor="end" fill="#18181b" font-size="12">0.48 s</text>

      <text x="0" y="85" fill="#18181b" font-size="12">2,048 tokens</text>
      <text x="145" y="85" fill="#2b8a3e" font-size="12" font-weight="700">1.68 s</text>
      <text x="395" y="85" text-anchor="end" fill="#e8590c" font-size="12" font-weight="700">7.68 s (4.5x)</text>

      <text x="0" y="120" fill="#18181b" font-size="12">4,096 tokens</text>
      <text x="145" y="120" fill="#2b8a3e" font-size="12" font-weight="700">3.35 s</text>
      <text x="395" y="120" text-anchor="end" fill="#c92a2a" font-size="12" font-weight="700">30.7 s (9.1x)</text>

      <text x="0" y="155" fill="#18181b" font-size="12">8,192 tokens</text>
      <text x="145" y="155" fill="#2b8a3e" font-size="12" font-weight="700">6.72 s</text>
      <text x="395" y="155" text-anchor="end" fill="#c92a2a" font-size="12" font-weight="800">CRASH (OOM-Kill)</text>

      <text x="0" y="190" fill="#18181b" font-size="12">16,384 tokens</text>
      <text x="145" y="190" fill="#2b8a3e" font-size="12" font-weight="700">13.44 s</text>
      <text x="395" y="190" text-anchor="end" fill="#c92a2a" font-size="12" font-weight="800">CRASH (OOM-Kill)</text>

      <text x="0" y="225" fill="#18181b" font-size="12">32,768 tokens</text>
      <text x="145" y="225" fill="#2b8a3e" font-size="12" font-weight="800">26.88 s</text>
      <text x="395" y="225" text-anchor="end" fill="#c92a2a" font-size="12" font-weight="800">CRASH (OOM-Kill)</text>

      <line x1="0" y1="245" x2="410" y2="245" stroke="#e4e4e7"/>
      <text x="0" y="270" fill="#1971c2" font-size="11" font-weight="700">Scaling Law: Strict O(N) linear time scaling per token</text>
    </g>
  </g>

  <!-- Right Card: Peak Memory Footprint -->
  <g transform="translate(520, 90)">
    <rect width="450" height="350" rx="8" fill="#ffffff" stroke="#18181b" stroke-width="1.8"/>
    <rect width="450" height="32" rx="8" fill="#f4f4f5" stroke="#18181b" stroke-width="1.8"/>
    <line x1="0" y1="32" x2="450" y2="32" stroke="#18181b" stroke-width="1.8"/>
    <text x="225" y="21" text-anchor="middle" fill="#18181b" font-size="13" font-weight="800">Peak Process RSS Memory (MB)</text>

    <!-- Ceiling Line Reference -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#71717a" font-size="11" font-weight="700">Context Length</text>
      <text x="150" y="15" fill="#2b8a3e" font-size="11" font-weight="800">Kura Bounded RSS</text>
      <text x="395" y="15" text-anchor="end" fill="#71717a" font-size="11" font-weight="700">7.5 GB Margin</text>
      <line x1="0" y1="25" x2="410" y2="25" stroke="#e4e4e7"/>

      <text x="0" y="50" fill="#18181b" font-size="12">512 tokens</text>
      <text x="150" y="50" fill="#2b8a3e" font-size="12">3,240 MB</text>
      <text x="395" y="50" text-anchor="end" fill="#71717a" font-size="12">+4,260 MB free</text>

      <text x="0" y="85" fill="#18181b" font-size="12">2,048 tokens</text>
      <text x="150" y="85" fill="#2b8a3e" font-size="12">3,926 MB</text>
      <text x="395" y="85" text-anchor="end" fill="#71717a" font-size="12">+3,574 MB free</text>

      <text x="0" y="120" fill="#18181b" font-size="12">4,096 tokens</text>
      <text x="150" y="120" fill="#2b8a3e" font-size="12">4,410 MB</text>
      <text x="395" y="120" text-anchor="end" fill="#71717a" font-size="12">+3,090 MB free</text>

      <text x="0" y="155" fill="#18181b" font-size="12">8,192 tokens</text>
      <text x="150" y="155" fill="#2b8a3e" font-size="12">5,120 MB</text>
      <text x="395" y="155" text-anchor="end" fill="#71717a" font-size="12">+2,380 MB free</text>

      <text x="0" y="190" fill="#18181b" font-size="12">16,384 tokens</text>
      <text x="150" y="190" fill="#2b8a3e" font-size="12">5,890 MB</text>
      <text x="395" y="190" text-anchor="end" fill="#71717a" font-size="12">+1,610 MB free</text>

      <text x="0" y="225" fill="#18181b" font-size="12">32,768 tokens</text>
      <text x="150" y="225" fill="#2b8a3e" font-size="12" font-weight="800">6,580 MB</text>
      <text x="395" y="225" text-anchor="end" fill="#2b8a3e" font-size="12" font-weight="800">+920 MB free</text>

      <line x1="0" y1="245" x2="410" y2="245" stroke="#e4e4e7"/>
      <text x="0" y="270" fill="#2b8a3e" font-size="11" font-weight="700">Zero OOM Kills: Stays strictly within 7.5 GB cgroup ceiling</text>
    </g>
  </g>
</svg>