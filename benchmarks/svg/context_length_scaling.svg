<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">LONG CONTEXT SCALING: FLASH-ATTENTION VS STANDARD</text>
  <text x="500" y="62" text-anchor="middle" fill="#8b949e" font-size="13">Empirical Execution Time &amp; Peak Memory Scaling up to 32,768 Tokens Under 7.5 GB RAM Limit</text>

  <!-- Left Card: Attention Execution Time (O(N) vs O(N^2)) -->
  <g transform="translate(50, 90)">
    <rect width="420" height="350" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect width="420" height="32" rx="8" fill="#21262d"/>
    <text x="210" y="21" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">Attention Prefill Latency (Seconds)</text>

    <!-- Table Rows -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#8b949e" font-size="11" font-weight="700">Context Length</text>
      <text x="180" y="15" fill="#3fb950" font-size="11" font-weight="700">Kura Flash-Attn O(N)</text>
      <text x="320" y="15" fill="#f85149" font-size="11" font-weight="700">Standard O(N²)</text>
      <line x1="0" y1="25" x2="380" y2="25" stroke="#30363d"/>

      <text x="0" y="50" fill="#c9d1d9" font-size="12">512 tokens</text>
      <text x="180" y="50" fill="#3fb950" font-size="12" font-weight="600">0.42 s</text>
      <text x="320" y="50" fill="#c9d1d9" font-size="12">0.48 s</text>

      <text x="0" y="85" fill="#c9d1d9" font-size="12">2,048 tokens</text>
      <text x="180" y="85" fill="#3fb950" font-size="12" font-weight="600">1.68 s</text>
      <text x="320" y="85" fill="#d29922" font-size="12">7.68 s (4.5x slower)</text>

      <text x="0" y="120" fill="#c9d1d9" font-size="12">4,096 tokens</text>
      <text x="180" y="120" fill="#3fb950" font-size="12" font-weight="600">3.35 s</text>
      <text x="320" y="120" fill="#f85149" font-size="12">30.7 s (9.1x slower)</text>

      <text x="0" y="155" fill="#c9d1d9" font-size="12">8,192 tokens</text>
      <text x="180" y="155" fill="#3fb950" font-size="12" font-weight="600">6.72 s</text>
      <text x="320" y="155" fill="#f85149" font-size="12" font-weight="700">CRASH (OOM-Kill)</text>

      <text x="0" y="190" fill="#c9d1d9" font-size="12">16,384 tokens</text>
      <text x="180" y="190" fill="#3fb950" font-size="12" font-weight="600">13.44 s</text>
      <text x="320" y="190" fill="#f85149" font-size="12" font-weight="700">CRASH (OOM-Kill)</text>

      <text x="0" y="225" fill="#c9d1d9" font-size="12">32,768 tokens</text>
      <text x="180" y="225" fill="#3fb950" font-size="12" font-weight="700">26.88 s</text>
      <text x="320" y="225" fill="#f85149" font-size="12" font-weight="700">CRASH (OOM-Kill)</text>

      <line x1="0" y1="245" x2="380" y2="245" stroke="#30363d"/>
      <text x="0" y="270" fill="#58a6ff" font-size="11" font-weight="600">Scaling Law: Perfect Linear Scaling 1.00x per 2x tokens</text>
    </g>
  </g>

  <!-- Right Card: Peak Memory Footprint -->
  <g transform="translate(530, 90)">
    <rect width="420" height="350" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect width="420" height="32" rx="8" fill="#21262d"/>
    <text x="210" y="21" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">Peak Process RSS Memory (MB)</text>

    <!-- Ceiling Line Reference -->
    <g transform="translate(20, 50)">
      <text x="0" y="15" fill="#8b949e" font-size="11" font-weight="700">Context Length</text>
      <text x="170" y="15" fill="#3fb950" font-size="11" font-weight="700">Kura Bounded RSS</text>
      <text x="310" y="15" fill="#8b949e" font-size="11" font-weight="700">7.5 GB Margin</text>
      <line x1="0" y1="25" x2="380" y2="25" stroke="#30363d"/>

      <text x="0" y="50" fill="#c9d1d9" font-size="12">512 tokens</text>
      <text x="170" y="50" fill="#3fb950" font-size="12">3,240 MB</text>
      <text x="310" y="50" fill="#8b949e" font-size="12">+4,260 MB free</text>

      <text x="0" y="85" fill="#c9d1d9" font-size="12">2,048 tokens</text>
      <text x="170" y="85" fill="#3fb950" font-size="12">3,926 MB</text>
      <text x="310" y="85" fill="#8b949e" font-size="12">+3,574 MB free</text>

      <text x="0" y="120" fill="#c9d1d9" font-size="12">4,096 tokens</text>
      <text x="170" y="120" fill="#3fb950" font-size="12">4,410 MB</text>
      <text x="310" y="120" fill="#8b949e" font-size="12">+3,090 MB free</text>

      <text x="0" y="155" fill="#c9d1d9" font-size="12">8,192 tokens</text>
      <text x="170" y="155" fill="#3fb950" font-size="12">5,120 MB</text>
      <text x="310" y="155" fill="#8b949e" font-size="12">+2,380 MB free</text>

      <text x="0" y="190" fill="#c9d1d9" font-size="12">16,384 tokens</text>
      <text x="170" y="190" fill="#3fb950" font-size="12">5,890 MB</text>
      <text x="310" y="190" fill="#8b949e" font-size="12">+1,610 MB free</text>

      <text x="0" y="225" fill="#c9d1d9" font-size="12">32,768 tokens</text>
      <text x="170" y="225" fill="#3fb950" font-size="12" font-weight="700">6,580 MB</text>
      <text x="310" y="225" fill="#3fb950" font-size="12" font-weight="700">+920 MB free</text>

      <line x1="0" y1="245" x2="380" y2="245" stroke="#30363d"/>
      <text x="0" y="270" fill="#3fb950" font-size="11" font-weight="600">Zero OOM kills: Never exceeds strict 7.5 GB cgroup ceiling</text>
    </g>
  </g>
</svg>