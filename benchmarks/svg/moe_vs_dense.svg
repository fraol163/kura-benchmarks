<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#18181b" font-size="20" font-weight="800">THE MoE ARCHITECTURAL SUPERIORITY LAW</text>
  <text x="500" y="62" text-anchor="middle" fill="#71717a" font-size="13">Empirical Throughput Under Constrained RAM ($80 Budget NVMe SSD)</text>

  <!-- Highlight Badge -->
  <g transform="translate(380, 80)">
    <rect width="240" height="30" rx="15" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
    <text x="120" y="20" text-anchor="middle" fill="#2b8a3e" font-size="13" font-weight="800">400x MoE THROUGHPUT ADVANTAGE</text>
  </g>

  <!-- Card 1: Sparse MoE -->
  <g transform="translate(40, 130)">
    <rect width="430" height="310" rx="8" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
    <rect width="430" height="36" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
    <line x1="0" y1="36" x2="430" y2="36" stroke="#2f9e44" stroke-width="2"/>
    <text x="215" y="24" text-anchor="middle" fill="#2b8a3e" font-size="14" font-weight="800">SPARSE MoE: OLMoE 1B-7B</text>

    <!-- Big Number -->
    <text x="215" y="95" text-anchor="middle" fill="#2b8a3e" font-size="44" font-weight="800">15.2 tok/s</text>
    <text x="215" y="118" text-anchor="middle" fill="#71717a" font-size="12">Single Budget NVMe SSD (1,500 MB/s)</text>

    <!-- Progress Bar (100% full scale) -->
    <rect x="25" y="135" width="380" height="14" rx="7" fill="#f4f4f5" stroke="#d4d4d8"/>
    <rect x="25" y="135" width="380" height="14" rx="7" fill="#2f9e44"/>

    <!-- Metrics -->
    <line x1="25" y1="165" x2="405" y2="165" stroke="#e4e4e7"/>
    <text x="25" y="190" fill="#18181b" font-size="12">Total Parameters: <tspan fill="#18181b" font-weight="800">6.9 Billion</tspan></text>
    <text x="25" y="212" fill="#18181b" font-size="12">Active Parameters / Token: <tspan fill="#2b8a3e" font-weight="800">1.3 Billion (18.8%)</tspan></text>
    <text x="25" y="234" fill="#18181b" font-size="12">NVMe I/O per Token: <tspan fill="#2b8a3e" font-weight="800">68 MB (4.1% weights loaded)</tspan></text>
    <text x="25" y="256" fill="#18181b" font-size="12">Hardware: <tspan fill="#18181b" font-weight="800">Standard $80 NVMe SSD</tspan></text>
    <text x="25" y="285" fill="#2b8a3e" font-size="12" font-weight="800">VERDICT: PRODUCTION READY &amp; FAST</text>
  </g>

  <!-- Card 2: Dense 70B -->
  <g transform="translate(530, 130)">
    <rect width="430" height="310" rx="8" fill="#ffffff" stroke="#e03131" stroke-width="2"/>
    <rect width="430" height="36" rx="8" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
    <line x1="0" y1="36" x2="430" y2="36" stroke="#e03131" stroke-width="2"/>
    <text x="215" y="24" text-anchor="middle" fill="#c92a2a" font-size="14" font-weight="800">DENSE 70B: LLAMA-3.1 70B</text>

    <!-- Big Number -->
    <text x="215" y="95" text-anchor="middle" fill="#c92a2a" font-size="44" font-weight="800">0.058 tok/s</text>
    <text x="215" y="118" text-anchor="middle" fill="#71717a" font-size="12">Single Budget NVMe SSD (1,500 MB/s)</text>

    <!-- Progress Bar (tiny bar ~0.35%) -->
    <rect x="25" y="135" width="380" height="14" rx="7" fill="#f4f4f5" stroke="#d4d4d8"/>
    <rect x="25" y="135" width="6" height="14" rx="3" fill="#e03131"/>

    <!-- Metrics -->
    <line x1="25" y1="165" x2="405" y2="165" stroke="#e4e4e7"/>
    <text x="25" y="190" fill="#18181b" font-size="12">Total Parameters: <tspan fill="#18181b" font-weight="800">70.6 Billion</tspan></text>
    <text x="25" y="212" fill="#18181b" font-size="12">Active Parameters / Token: <tspan fill="#c92a2a" font-weight="800">70.6 Billion (100.0%)</tspan></text>
    <text x="25" y="234" fill="#18181b" font-size="12">NVMe I/O per Token: <tspan fill="#c92a2a" font-weight="800">35,000 MB (100% weights loaded)</tspan></text>
    <text x="25" y="256" fill="#18181b" font-size="12">Hardware: <tspan fill="#c92a2a" font-weight="800">Needs 15x Gen4 NVMe RAID-0 Array</tspan></text>
    <text x="25" y="285" fill="#c92a2a" font-size="12" font-weight="800">VERDICT: STORAGE BOUND (&lt; 0.1 TOK/S)</text>
  </g>
</svg>