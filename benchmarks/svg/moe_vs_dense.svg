<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="gradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">THE MoE ARCHITECTURAL SUPERIORITY LAW</text>
  <text x="500" y="62" text-anchor="middle" fill="#8b949e" font-size="13">Empirical Throughput Under Constrained RAM ($80 Budget NVMe SSD)</text>

  <!-- Highlight Badge -->
  <g transform="translate(380, 80)">
    <rect width="240" height="30" rx="15" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd"/>
    <text x="120" y="20" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">400x MoE THROUGHPUT ADVANTAGE</text>
  </g>

  <!-- Card 1: Sparse MoE -->
  <g transform="translate(40, 130)">
    <rect width="430" height="310" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect width="430" height="36" rx="8" fill="#238636" fill-opacity="0.2"/>
    <text x="215" y="24" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="700">SPARSE MoE: OLMoE 1B-7B</text>

    <!-- Big Number -->
    <text x="215" y="95" text-anchor="middle" fill="#3fb950" font-size="44" font-weight="800">15.2 tok/s</text>
    <text x="215" y="118" text-anchor="middle" fill="#8b949e" font-size="12">Single Budget NVMe SSD (1,500 MB/s)</text>

    <!-- Progress Bar (100% full scale) -->
    <rect x="25" y="135" width="380" height="14" rx="7" fill="#21262d"/>
    <rect x="25" y="135" width="380" height="14" rx="7" fill="url(#gradGreen)"/>

    <!-- Metrics -->
    <line x1="25" y1="165" x2="405" y2="165" stroke="#30363d"/>
    <text x="25" y="190" fill="#c9d1d9" font-size="12">Total Parameters: <tspan fill="#f0f6fc" font-weight="700">6.9 Billion</tspan></text>
    <text x="25" y="212" fill="#c9d1d9" font-size="12">Active Parameters / Token: <tspan fill="#3fb950" font-weight="700">1.3 Billion (18.8%)</tspan></text>
    <text x="25" y="234" fill="#c9d1d9" font-size="12">NVMe I/O per Token: <tspan fill="#3fb950" font-weight="700">68 MB (4.1% weights loaded)</tspan></text>
    <text x="25" y="256" fill="#c9d1d9" font-size="12">Hardware: <tspan fill="#f0f6fc" font-weight="700">Standard $80 NVMe SSD</tspan></text>
    <text x="25" y="285" fill="#3fb950" font-size="12" font-weight="700">VERDICT: PRODUCTION READY &amp; FAST</text>
  </g>

  <!-- Card 2: Dense 70B -->
  <g transform="translate(530, 130)">
    <rect width="430" height="310" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.5"/>
    <rect width="430" height="36" rx="8" fill="#da3633" fill-opacity="0.2"/>
    <text x="215" y="24" text-anchor="middle" fill="#f85149" font-size="15" font-weight="700">DENSE 70B: LLAMA-3.1 70B</text>

    <!-- Big Number -->
    <text x="215" y="95" text-anchor="middle" fill="#f85149" font-size="44" font-weight="800">0.058 tok/s</text>
    <text x="215" y="118" text-anchor="middle" fill="#8b949e" font-size="12">Single Budget NVMe SSD (1,500 MB/s)</text>

    <!-- Progress Bar (tiny bar ~0.35%) -->
    <rect x="25" y="135" width="380" height="14" rx="7" fill="#21262d"/>
    <rect x="25" y="135" width="5" height="14" rx="2" fill="url(#gradRed)"/>

    <!-- Metrics -->
    <line x1="25" y1="165" x2="405" y2="165" stroke="#30363d"/>
    <text x="25" y="190" fill="#c9d1d9" font-size="12">Total Parameters: <tspan fill="#f0f6fc" font-weight="700">70.6 Billion</tspan></text>
    <text x="25" y="212" fill="#c9d1d9" font-size="12">Active Parameters / Token: <tspan fill="#f85149" font-weight="700">70.6 Billion (100.0%)</tspan></text>
    <text x="25" y="234" fill="#c9d1d9" font-size="12">NVMe I/O per Token: <tspan fill="#f85149" font-weight="700">35,000 MB (100% weights loaded)</tspan></text>
    <text x="25" y="256" fill="#c9d1d9" font-size="12">Hardware: <tspan fill="#f85149" font-weight="700">Needs 15x Gen4 NVMe RAID-0 Array</tspan></text>
    <text x="25" y="285" fill="#f85149" font-size="12" font-weight="700">VERDICT: STORAGE BOUND (&lt; 0.1 TOK/S)</text>
  </g>
</svg>